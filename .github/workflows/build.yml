name: Build MinuoPDF, Test & Documentation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests & Sync Results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare PDFium & Test Fixtures
        run: |
          python scripts/ensure_pdfium.py
          python scripts/ensure_fixtures.py

      - name: Run Rust Unit Tests
        id: rust_test
        run: |
          mkdir -p test-results
          cd src-tauri && cargo test 2>&1 | tee ../test-results/cargo-test.log
          cd ..
          python scripts/sync_test_results.py

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E GUI Tests
        id: gui_test
        if: always()
        run: |
          npx playwright test || true
          python scripts/sync_test_results.py

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Log / Report |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          if [ -f "test-results/cargo-test.log" ]; then
            echo "| Rust Unit Tests | Completed | [cargo-test.log](Artifacts) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "playwright-report" ]; then
            echo "| Playwright GUI E2E | Completed | [playwright-report](Artifacts) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-reports
          path: |
            test-results/
            playwright-report/

      - name: Upload Synced Documentation RST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synced-docs-rst
          path: docs/test_results.rst

  build-app:
    name: Build Application (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Note: Linux runner uses 'ubuntu-22.04' instead of 'ubuntu-24.04' for maximum glibc & OS compatibility
        # across wide Linux distributions while ensuring active security updates (standard support until 2027).
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build release distribution
        run: make build

      - name: Prepare Windows Distribution Package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release-dist/MinuoPDF-windows-x64
          cp -rf dist/MinuoPDF/* release-dist/MinuoPDF-windows-x64/

      - name: Prepare Linux Distribution Package
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-dist/MinuoPDF-linux-x64
          cp -rf dist/MinuoPDF/* release-dist/MinuoPDF-linux-x64/

      - name: Upload Windows Distribution Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: minuopdf-windows-x64-dist
          path: release-dist/

      - name: Upload Linux Distribution Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: minuopdf-linux-x64-dist
          path: release-dist/

  build-docs:
    name: Build Documentation
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Synced Test Results RST
        uses: actions/download-artifact@v4
        with:
          name: synced-docs-rst
          path: docs/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Sphinx Documentation
        run: make docs

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minuopdf-docs-html
          path: docs/_build/html/
