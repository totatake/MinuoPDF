[package]
name = "minuopdf"
version = "0.2.0"
description = "A lightweight, portable PDF optimization tool built with Rust and Tauri"
authors = ["MinuoPDF Contributors"]
edition = "2021"

[lib]
name = "minuopdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.4", features = ["derive"] }
lopdf = "0.31.0"
pdfium-render = "0.8.21"
image = "0.25.10"
tiff = "0.9.0"
fax = "0.2.1"
flate2 = "1.0"
allsorts = "0.14"
tauri-plugin-dialog = "2"
rayon = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

